site_name: Katsiaryna Salavei – Technical Writing Portfolio
site_description: Documentation samples by Katsiaryna Salavei, Senior Technical Writer
site_url: https://ksalavei-by.github.io/portfolio/
repo_url: https://github.com/ksalavei-by/portfolio
repo_name: ksalavei-by/portfolio

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Writing samples:
      - "NAND wear-leveling controller: design specification": dynamic-wear-leveling-controller-architecture-spec.md
      - "Digital signage playlists: user guide (German)": digital-signage-playlist-management-user-guide-DE.md
      - "Batch update management interface: user guide": batch-update-management-interface-user-guide-article.md
      - "Claims API reference: submit first notice of loss": claims-api-fnol-reference.md
      - "Merchant classification code updates: client notice": merchant-classification-code-updates.md
  - How this site is built: how-this-site-is-built.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
